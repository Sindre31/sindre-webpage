<script>
  // restore session accent before paint (shared across pages)
  (function () {
    try {
      var a = localStorage.getItem('site-accent');
      if (a) document.documentElement.style.setProperty('--accent', a);
    } catch (e) {}
  })();

<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); }

  #bg {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    z-index: 0;
  }

  .stage {
    position: fixed; inset: 0;
    z-index: 1;
    display: flex; flex-direction: column;
    padding: clamp(18px, 3.4vw, 40px);
  }

  /* ── brutalist frame: corner coordinates ── */
  .frame-tick {
    position: fixed;
    z-index: 6;
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }
  .frame-tick .dot {
    width: 5px; height: 5px; background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  .ft-tl { top: clamp(18px,3.4vw,40px); left: clamp(18px,3.4vw,40px); }
  .ft-tr { top: clamp(18px,3.4vw,40px); right: clamp(18px,3.4vw,40px); }
  .ft-bl { bottom: clamp(18px,3.4vw,40px); left: clamp(18px,3.4vw,40px); }
  .ft-br { bottom: clamp(18px,3.4vw,40px); right: clamp(18px,3.4vw,40px); flex-direction: row-reverse; }
  @media (max-width: 720px) { .ft-tr, .ft-bl { display: none; } }

  /* corner crop marks */
  .crop { position: fixed; width: 16px; height: 16px; z-index: 6; opacity: 0.5; }
  .crop::before, .crop::after { content:''; position:absolute; background: var(--line-2); }
  .crop::before { width: 16px; height: 1px; } .crop::after { width: 1px; height: 16px; }
  .crop.tl { top: 14px; left: 14px; } .crop.tl::before{top:0;left:0;} .crop.tl::after{top:0;left:0;}
  .crop.tr { top: 14px; right: 14px; } .crop.tr::before{top:0;right:0;} .crop.tr::after{top:0;right:0;}
  .crop.bl { bottom: 14px; left: 14px; } .crop.bl::before{bottom:0;left:0;} .crop.bl::after{bottom:0;left:0;}
  .crop.br { bottom: 14px; right: 14px; } .crop.br::before{bottom:0;right:0;} .crop.br::after{bottom:0;right:0;}

  /* ── hero ── */
  .hero {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    max-width: 1320px; width: 100%; margin: 0 auto;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: clamp(14px, 2.4vw, 30px);
  }
  .eyebrow::before { content:''; width: clamp(28px,4vw,60px); height: 1px; background: var(--accent); }
  .eyebrow b { color: var(--accent); font-weight: 500; }

  .name {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(58px, 13.5vw, 215px);
    line-height: 0.84;
    letter-spacing: -0.025em;
    color: var(--fg);
  }
  .name .l2 { display: block; font-style: italic; color: var(--fg); padding-left: 0.06em; }
  .name .l2 .nib { color: var(--accent); }

  .subtitle {
    margin-top: clamp(20px, 3vw, 40px);
    max-width: 540px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px;
    font-family: var(--mono);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-dim);
    line-height: 1.9;
  }
  .subtitle .pipe { color: var(--accent); }

  /* ── projects entry ── */
  .enter {
    margin-top: clamp(34px, 5vw, 66px);
    display: inline-flex; align-items: stretch;
    width: min(560px, 100%);
    border: 1px solid var(--line-2);
    background: rgba(10,10,14,0.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-decoration: none;
    cursor: pointer;
    position: relative; overflow: hidden;
    transition: border-color 0.4s, transform 0.4s cubic-bezier(0.2,0.8,0.2,1);
  }
  .enter::before {
    content:''; position: absolute; inset: 0;
    background: var(--accent);
    transform: translateY(101%);
    transition: transform 0.5s cubic-bezier(0.7,0,0.2,1);
    z-index: 0;
  }
  .enter:hover { border-color: var(--accent); transform: translateY(-2px); }
  .enter:hover::before { transform: translateY(0); }
  .enter > * { position: relative; z-index: 1; transition: color 0.4s; }
  .enter:hover .en-idx,
  .enter:hover .en-main,
  .enter:hover .en-arrow { color: var(--accent-ink); }

  .en-idx {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em;
    color: var(--fg-faint);
    padding: 22px 0 22px 22px;
    align-self: stretch; display: flex; align-items: center;
  }
  .en-main {
    flex: 1;
    padding: 20px 18px;
    display: flex; flex-direction: column; gap: 4px;
    color: var(--fg);
  }
  .en-title { font-family: var(--serif); font-size: 32px; line-height: 1; letter-spacing: -0.01em; }
  .en-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-dim); }
  .enter:hover .en-sub { color: var(--accent-ink); opacity: 0.7; }
  .en-arrow {
    align-self: stretch; display: flex; align-items: center;
    padding: 0 24px;
    border-left: 1px solid var(--line);
    color: var(--accent);
    font-size: 26px;
  }
  .enter:hover .en-arrow { border-left-color: rgba(8,8,10,0.25); }
  .en-arrow svg { width: 30px; height: 30px; transition: transform 0.45s cubic-bezier(0.2,0.8,0.2,1); }
  .enter:hover .en-arrow svg { transform: translateX(6px); }

  /* ── bottom status marquee ── */
  .status {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    border-top: 1px solid var(--line);
    background: linear-gradient(to top, rgba(8,8,10,0.9), transparent);
    padding: 12px clamp(18px,3.4vw,40px);
    display: flex; justify-content: space-between; align-items: center; gap: 18px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--fg-faint);
  }
  .status .clock { color: var(--fg-dim); }
  .status .live { display: inline-flex; align-items: center; gap: 8px; }
  .status .live::before { content:''; width:6px;height:6px;border-radius:50%; background: var(--accent); animation: blip 1.6s ease-in-out infinite; }
  @keyframes blip { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.25;transform:scale(0.6);} }
  @media (max-width: 600px) { .status .mid { display:none; } }

  /* ── intro reveal (auto-playing keyframes; base state is VISIBLE) ── */
  @keyframes revIn {
    from { opacity: 0; transform: translateY(26px); filter: blur(8px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  .rev { animation: revIn 1s cubic-bezier(0.2,0.7,0.2,1) backwards; }
  .d1 { animation-delay: 0.15s; }
  .d2 { animation-delay: 0.30s; }
  .d3 { animation-delay: 0.48s; }
  .d4 { animation-delay: 0.66s; }
  .d5 { animation-delay: 0.84s; }

  /* mask reveal for name lines */
  @keyframes maskUp { from { transform: translateY(108%); } to { transform: translateY(0); } }
  .mask { overflow: hidden; }
  .mask > span { display: block; animation: maskUp 1.05s cubic-bezier(0.16,1,0.3,1) backwards; }
  .mask.m1 > span { animation-delay: 0.18s; }
  .mask.m2 > span { animation-delay: 0.34s; }

  @media (prefers-reduced-motion: reduce) {
    .rev, .mask > span { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>

  <!--
    The hero below is the crawlable copy of what App() renders. React replaces
    it on mount, so it must stay in sync with the markup in app.jsx — without it
    the page ships no indexable text at all, since everything else is client-rendered.
  -->
  <div id="app">
    <div class="stage">
      <div class="frame-tick ft-tl rev d1"><span class="dot"></span> 62.47°N / 6.15°E</div>
      <div class="frame-tick ft-tr rev d1">EST. 2003 · ÅLESUND</div>

      <main class="hero">

          <span class="mask m1"><span>Sindre</span></span>
          <span class="l2 mask m2"><span>Stolt<span class="nib">·</span>Nielsen</span></span>
        </h1>
        <div class="subtitle rev d3">
          <span>Bergen</span><span class="pipe">/</span><span>Berkeley</span>
          <span class="pipe">·</span><span>IT &amp; Economics</span>
        </div>

        <a href="/projects.html" class="enter rev d4">
          <span class="en-idx">00 ▸</span>
          <span class="en-main">
            <span class="en-title">Projects</span>
            <span class="en-sub">Selected work · 22 entries</span>
          </span>
          <span class="en-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
          </span>
        </a>
      </main>
    </div>
  </div>

  <div class="wipe"><div class="wipe-mark">// loading</div></div>

  <!-- React (pinned, production builds). JSX is precompiled — see build.js. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

</body>
