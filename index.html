<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sindre Stolt-Nielsen</title>
<meta name="description" content="Sindre Stolt-Nielsen — personal index." />
<link rel="icon" type="image/png" href="images/favicon.png" />
<link rel="stylesheet" href="theme.css" />
<script src="analytics.js"></script>
<script>
  // restore session accent before paint (shared across pages)
  (function () {
    try {
      var a = localStorage.getItem('site-accent');
      if (a) document.documentElement.style.setProperty('--accent', a);
    } catch (e) {}
  })();
</script>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); }

  #bg {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    z-index: 0;
  }

  .stage {
    position: fixed; inset: 0;
    z-index: 1;
    display: flex; flex-direction: column;
    padding: clamp(18px, 3.4vw, 40px);
  }

  /* ── brutalist frame: corner coordinates ── */
  .frame-tick {
    position: fixed;
    z-index: 6;
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }
  .frame-tick .dot {
    width: 5px; height: 5px; background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  .ft-tl { top: clamp(18px,3.4vw,40px); left: clamp(18px,3.4vw,40px); }
  .ft-tr { top: clamp(18px,3.4vw,40px); right: clamp(18px,3.4vw,40px); }
  .ft-bl { bottom: clamp(18px,3.4vw,40px); left: clamp(18px,3.4vw,40px); }
  .ft-br { bottom: clamp(18px,3.4vw,40px); right: clamp(18px,3.4vw,40px); flex-direction: row-reverse; }
  @media (max-width: 720px) { .ft-tr, .ft-bl { display: none; } }

  /* corner crop marks */
  .crop { position: fixed; width: 16px; height: 16px; z-index: 6; opacity: 0.5; }
  .crop::before, .crop::after { content:''; position:absolute; background: var(--line-2); }
  .crop::before { width: 16px; height: 1px; } .crop::after { width: 1px; height: 16px; }
  .crop.tl { top: 14px; left: 14px; } .crop.tl::before{top:0;left:0;} .crop.tl::after{top:0;left:0;}
  .crop.tr { top: 14px; right: 14px; } .crop.tr::before{top:0;right:0;} .crop.tr::after{top:0;right:0;}
  .crop.bl { bottom: 14px; left: 14px; } .crop.bl::before{bottom:0;left:0;} .crop.bl::after{bottom:0;left:0;}
  .crop.br { bottom: 14px; right: 14px; } .crop.br::before{bottom:0;right:0;} .crop.br::after{bottom:0;right:0;}

  /* ── hero ── */
  .hero {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    max-width: 1320px; width: 100%; margin: 0 auto;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: clamp(14px, 2.4vw, 30px);
  }
  .eyebrow::before { content:''; width: clamp(28px,4vw,60px); height: 1px; background: var(--accent); }
  .eyebrow b { color: var(--accent); font-weight: 500; }

  .name {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(58px, 13.5vw, 215px);
    line-height: 0.84;
    letter-spacing: -0.025em;
    color: var(--fg);
  }
  .name .l2 { display: block; font-style: italic; color: var(--fg); padding-left: 0.06em; }
  .name .l2 .nib { color: var(--accent); }

  .subtitle {
    margin-top: clamp(20px, 3vw, 40px);
    max-width: 540px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px;
    font-family: var(--mono);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-dim);
    line-height: 1.9;
  }
  .subtitle .pipe { color: var(--accent); }

  /* ── projects entry ── */
  .enter {
    margin-top: clamp(34px, 5vw, 66px);
    display: inline-flex; align-items: stretch;
    width: min(560px, 100%);
    border: 1px solid var(--line-2);
    background: rgba(10,10,14,0.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-decoration: none;
    cursor: pointer;
    position: relative; overflow: hidden;
    transition: border-color 0.4s, transform 0.4s cubic-bezier(0.2,0.8,0.2,1);
  }
  .enter::before {
    content:''; position: absolute; inset: 0;
    background: var(--accent);
    transform: translateY(101%);
    transition: transform 0.5s cubic-bezier(0.7,0,0.2,1);
    z-index: 0;
  }
  .enter:hover { border-color: var(--accent); transform: translateY(-2px); }
  .enter:hover::before { transform: translateY(0); }
  .enter > * { position: relative; z-index: 1; transition: color 0.4s; }
  .enter:hover .en-idx,
  .enter:hover .en-main,
  .enter:hover .en-arrow { color: var(--accent-ink); }

  .en-idx {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em;
    color: var(--fg-faint);
    padding: 22px 0 22px 22px;
    align-self: stretch; display: flex; align-items: center;
  }
  .en-main {
    flex: 1;
    padding: 20px 18px;
    display: flex; flex-direction: column; gap: 4px;
    color: var(--fg);
  }
  .en-title { font-family: var(--serif); font-size: 32px; line-height: 1; letter-spacing: -0.01em; }
  .en-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-dim); }
  .enter:hover .en-sub { color: var(--accent-ink); opacity: 0.7; }
  .en-arrow {
    align-self: stretch; display: flex; align-items: center;
    padding: 0 24px;
    border-left: 1px solid var(--line);
    color: var(--accent);
    font-size: 26px;
  }
  .enter:hover .en-arrow { border-left-color: rgba(8,8,10,0.25); }
  .en-arrow svg { width: 30px; height: 30px; transition: transform 0.45s cubic-bezier(0.2,0.8,0.2,1); }
  .enter:hover .en-arrow svg { transform: translateX(6px); }

  /* ── bottom status marquee ── */
  .status {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    border-top: 1px solid var(--line);
    background: linear-gradient(to top, rgba(8,8,10,0.9), transparent);
    padding: 12px clamp(18px,3.4vw,40px);
    display: flex; justify-content: space-between; align-items: center; gap: 18px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--fg-faint);
  }
  .status .clock { color: var(--fg-dim); }
  .status .live { display: inline-flex; align-items: center; gap: 8px; }
  .status .live::before { content:''; width:6px;height:6px;border-radius:50%; background: var(--accent); animation: blip 1.6s ease-in-out infinite; }
  @keyframes blip { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.25;transform:scale(0.6);} }
  @media (max-width: 600px) { .status .mid { display:none; } }

  /* ── intro reveal (auto-playing keyframes; base state is VISIBLE) ── */
  @keyframes revIn {
    from { opacity: 0; transform: translateY(26px); filter: blur(8px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  .rev { animation: revIn 1s cubic-bezier(0.2,0.7,0.2,1) backwards; }
  .d1 { animation-delay: 0.15s; }
  .d2 { animation-delay: 0.30s; }
  .d3 { animation-delay: 0.48s; }
  .d4 { animation-delay: 0.66s; }
  .d5 { animation-delay: 0.84s; }

  /* mask reveal for name lines */
  @keyframes maskUp { from { transform: translateY(108%); } to { transform: translateY(0); } }
  .mask { overflow: hidden; }
  .mask > span { display: block; animation: maskUp 1.05s cubic-bezier(0.16,1,0.3,1) backwards; }
  .mask.m1 > span { animation-delay: 0.18s; }
  .mask.m2 > span { animation-delay: 0.34s; }

  @media (prefers-reduced-motion: reduce) {
    .rev, .mask > span { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>

  <div id="app"></div>

  <div class="wipe"><div class="wipe-mark">// loading</div></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="bg-field.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "bgMode": "flow",
      "accent": "#FF6A3D",
      "intensity": 0.5,
      "grain": true,
      "scanlines": true
    }/*EDITMODE-END*/;

    const ACCENTS = ["#C2F24A", "#4ED8E6", "#FF6A3D", "#B98CFF", "#ECEAE3"];
    const MODES = ["flow", "grid", "plasma"];

    function useClock() {
      const [now, setNow] = useState("");
      useEffect(() => {
        const tick = () => {
          const s = new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/Oslo", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
          setNow(`${s} OSLO`);
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      }, []);
      return now;
    }

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const fieldRef = useRef(null);
      const clock = useClock();

      // boot the canvas field once
      useEffect(() => {
        const cv = document.getElementById("bg");
        const f = new BackgroundField(cv, {
          mode: t.bgMode, accent: t.accent, intensity: t.intensity, bg: "#08080A"
        });
        f.start();
        fieldRef.current = f;
        const onMove = (e) => f.setMouse(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
        window.addEventListener("pointermove", onMove);
        const onVis = () => (document.hidden ? f.stop() : f.start());
        document.addEventListener("visibilitychange", onVis);
        return () => {
          window.removeEventListener("pointermove", onMove);
          document.removeEventListener("visibilitychange", onVis);
          f.destroy();
        };
      }, []);

      // react to tweaks
      useEffect(() => {
        document.documentElement.style.setProperty("--accent", t.accent);
        try { localStorage.setItem("site-accent", t.accent); } catch (e) {}
        if (fieldRef.current) fieldRef.current.setOptions({ accent: t.accent, mode: t.bgMode, intensity: t.intensity });
      }, [t.accent, t.bgMode, t.intensity]);

      // tweaks panel mounts below; intro animation safety net
      useEffect(() => {
        const id = setTimeout(() => document.documentElement.classList.add("anim-settled"), 1700);
        return () => clearTimeout(id);
      }, []);

      const go = (e) => {
        e.preventDefault();
        const wipe = document.querySelector(".wipe");
        wipe.querySelector(".wipe-mark").textContent = "// projects";
        wipe.classList.add("in");
        setTimeout(() => { window.location.href = "projects.html"; }, 540);
      };

      return (
        <div className="stage">
          {t.grain && <div className="fx-grain"></div>}
          {t.scanlines && <div className="fx-scan"></div>}

          <div className="frame-tick ft-tl rev d1"><span className="dot"></span> 62.47°N / 6.15°E</div>
          <div className="frame-tick ft-tr rev d1">EST. 2003 · ÅLESUND</div>

          <main className="hero">
            <div className="eyebrow rev d1">Project Website</div>
            <h1 className="name">
              <span className="mask m1"><span>Sindre</span></span>
              <span className="l2 mask m2"><span>Stolt<span className="nib">·</span>Nielsen</span></span>
            </h1>
            <div className="subtitle rev d3">
              <span>Bergen</span><span className="pipe">/</span><span>Berkeley</span>
              <span className="pipe">·</span><span>IT &amp; Economics</span>
            </div>

            <a href="projects.html" className="enter rev d4" onClick={go}>
              <span className="en-idx">00 ▸</span>
              <span className="en-main">
                <span className="en-title">Projects</span>
                <span className="en-sub">Selected work · 20 entries</span>
              </span>
              <span className="en-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
              </span>
            </a>
          </main>

          <div className="status rev d5">
            <span className="live">System nominal</span>
            <span className="clock">{clock}</span>
          </div>

          <TweaksPanel>
            <TweakSection label="Background field" />
            <TweakRadio label="Mode" value={t.bgMode} options={MODES}
              onChange={(v) => setTweak("bgMode", v)} />
            <TweakSlider label="Intensity" value={t.intensity} min={0.4} max={1.6} step={0.1}
              onChange={(v) => setTweak("intensity", v)} />
            <TweakSection label="Accent" />
            <TweakColor label="Signal" value={t.accent} options={ACCENTS}
              onChange={(v) => setTweak("accent", v)} />
            <TweakSection label="Texture" />
            <TweakToggle label="Film grain" value={t.grain} onChange={(v) => setTweak("grain", v)} />
            <TweakToggle label="Scanlines" value={t.scanlines} onChange={(v) => setTweak("scanlines", v)} />
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
