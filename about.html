<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About — Sindre Stolt-Nielsen</title>
<link rel="icon" type="image/png" href="images/favicon.png" />
<link rel="stylesheet" href="theme.css" />
<script>
  (function () { try { var a = localStorage.getItem('site-accent'); if (a) document.documentElement.style.setProperty('--accent', a); } catch (e) {} })();
</script>
<style>
  body { min-height: 100vh; background: var(--bg); }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; opacity: 0.55; }
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 60% 10%, rgba(8,8,10,0.15), rgba(8,8,10,0.9) 72%); }

  .shell { position: relative; z-index: 2; max-width: 1180px; margin: 0 auto;
    padding: clamp(20px,3vw,40px) clamp(20px,3.4vw,48px) 44px; }

  /* topbar (shared look with projects) */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: clamp(24px,4vw,52px); }
  .brand { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; }
  .brand .glyph { width: 38px; height: 38px; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--accent); transition: border-color .3s; }
  .brand:hover .glyph { border-color: var(--accent); }
  .brand .bt { font-family: var(--serif); font-size: 18px; color: var(--fg); line-height: 1; }
  .brand .bs { display:block; font-family: var(--mono); font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--fg-faint); margin-top: 4px; }
  .topnav { display: flex; align-items: center; gap: 6px; }
  .topnav a { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--fg-dim); text-decoration: none; padding: 9px 14px; border: 1px solid transparent; transition: color .25s, border-color .25s; }
  .topnav a .n { color: var(--fg-faint); margin-right: 7px; }
  .topnav a:hover { color: var(--accent); }
  .topnav a.cur { color: var(--fg); border-color: var(--line-2); }
  .topnav a.cur .n { color: var(--accent); }

  /* layout */
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent);
    display: inline-flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .eyebrow::before { content:''; width: 40px; height: 1px; background: var(--accent); }

  /* small (stacked): identity block over contact */
  .about { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: start; }
  /* medium: identity block (portrait over facts) beside contact */
  @media (min-width: 760px){ .about { grid-template-columns: 380px 1fr; gap: clamp(28px,4vw,60px); } }
  /* large: facts move to the right of the portrait, contact alongside */
  @media (min-width: 1080px){ .about { grid-template-columns: minmax(560px,1.25fr) 1fr; align-items: center; } }

  /* identity block: portrait + facts (stacked → side-by-side when wide) */
  .idblock { display: flex; flex-direction: column; gap: 24px; }
  @media (min-width: 1080px){
    .idblock { flex-direction: row; align-items: center; gap: clamp(28px,3vw,44px); }
    .idblock .portrait { width: clamp(320px,24vw,420px); }
  }

  /* left: portrait + facts */
  .portrait { position: relative; width: 100%; max-width: 400px; flex-shrink: 0; aspect-ratio: 4/5; overflow: hidden; border: 1px solid var(--line-2); background: var(--surface); }
  /* mobile: portrait fills the screen width (shell padding gives the side gutters) */
  @media (max-width: 759px){ .portrait { max-width: none; } }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; filter: grayscale(0.25) contrast(1.04); }
  .portrait figcaption { position: absolute; top: 14px; left: 14px; font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg); background: rgba(8,8,10,0.5); padding: 4px 8px; backdrop-filter: blur(4px); }
  .facts { flex: 1; min-width: 0; }
  .fact { display: grid; grid-template-columns: 88px 1fr; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .fact:last-child { border-bottom: 0; }
  .fact dt { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-faint); padding-top: 3px; }
  .fact dd { font-family: var(--ui); font-size: 14px; color: var(--fg); }
  .fact dd em { font-style: normal; color: var(--accent); }

  /* right: prose */
  .lede { font-family: var(--serif); font-weight: 400; font-size: clamp(32px,4vw,52px); line-height: 1.06;
    letter-spacing: -0.02em; color: var(--fg); margin-bottom: 38px; text-wrap: balance; }
  .lede em { font-style: italic; color: var(--accent); }
  .lede a { color: var(--fg); text-decoration: none; }
  .lede a em { border-bottom: 2px solid var(--line-2); transition: border-color .3s; }
  .lede a:hover em { border-color: var(--accent); }
  .contactcol { align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
  .mailbtn { align-self: flex-start; margin-top: 30px; display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg);
    text-decoration: none; border: 1px solid var(--line-2); padding: 14px 22px; transition: color .3s, border-color .3s, background .3s; }
  .mailbtn svg { width: 15px; height: 15px; transition: transform .35s; }
  .mailbtn:hover { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .mailbtn:hover svg { transform: translateX(4px); }
  @media (max-width: 759px){ .contactcol { align-self: auto; } }
  .prose p { font-family: var(--ui); font-size: clamp(16px,1.5vw,18px); line-height: 1.7; color: var(--fg-dim); max-width: 52ch; }
  .prose p + p { margin-top: 20px; }
  .prose strong { color: var(--fg); font-weight: 500; }

  .imgstrip { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 36px; }
  .strip-img { position: relative; aspect-ratio: 16/7; overflow: hidden; border: 1px solid var(--line); }
  .strip-img img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.2) contrast(1.03); transition: transform 1.1s cubic-bezier(0.2,0.7,0.2,1); }
  .strip-img:hover img { transform: scale(1.05); }
  .strip-img span { position: absolute; bottom: 12px; left: 14px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--fg); background: rgba(8,8,10,0.5); padding: 4px 8px; backdrop-filter: blur(4px); }

  .backrow { margin-top: clamp(28px,4vw,48px); padding-top: 22px; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .backlink { display: inline-flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--fg); text-decoration: none; border: 1px solid var(--line-2); padding: 14px 20px; transition: color .3s, border-color .3s, background .3s; }
  .backlink svg { width: 16px; height: 16px; transition: transform .35s; }
  .backlink:hover { color: var(--accent); border-color: var(--accent); }
  .backlink:hover svg { transform: translateX(-4px); }
  .sig { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--fg-dim); }

  /* reveal (base visible) */
  @keyframes up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  .rise { animation: up .9s cubic-bezier(0.2,0.7,0.2,1) backwards; }
  .r1{animation-delay:.05s} .r2{animation-delay:.16s} .r3{animation-delay:.28s} .r4{animation-delay:.4s} .r5{animation-delay:.52s}
  @media (prefers-reduced-motion: reduce){ .rise { animation: none; } }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="veil"></div>

  <div class="shell">
    <div class="topbar rise r1">
      <a href="index.html" class="brand" data-nav>
        <span class="glyph">S</span>
        <span><span class="bt">Sindre Stolt-Nielsen</span><span class="bs">Project Website</span></span>
      </a>
      <nav class="topnav">
        <a href="index.html" data-nav><span class="n">↩</span> Index</a>
        <a href="projects.html" data-nav><span class="n">01</span> Projects</a>
        <a href="about.html" class="cur"><span class="n">02</span> About</a>
      </nav>
    </div>

    <div class="eyebrow rise r2">Get in touch</div>

    <div class="about">
      <div class="idblock rise r3">
        <figure class="portrait">
          <figcaption>Sindre</figcaption>
          <img src="images/sindre.jpeg" alt="Portrait of Sindre Stolt-Nielsen" />
        </figure>
        <dl class="facts">
          <div class="fact"><dt>From</dt><dd>Ålesund, Norway</dd></div>
          <div class="fact"><dt>Studies</dt><dd>IT &amp; Economics · <em>Bergen</em></dd></div>
          <div class="fact"><dt>Recently</dt><dd>Exchange · <em>UC Berkeley</em></dd></div>
        </dl>
      </div>

      <div class="contactcol">
        <h1 class="lede rise r3">Contact me at <a href="mailto:stolt@live.no"><em>stolt@live.no</em></a></h1>
        <a href="mailto:stolt@live.no" class="mailbtn rise r4">
          Send a message
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>

    <div class="backrow rise r5">
      <a href="projects.html" class="backlink" data-nav>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M12 5l-7 7 7 7"/></svg>
        Back to projects
      </a>
      <span class="sig">— Sindre</span>
    </div>
  </div>

  <div class="wipe"><div class="wipe-mark">//</div></div>

  <script src="bg-field.js"></script>
  <script>
    (function () {
      setTimeout(function () { document.documentElement.classList.add('anim-settled'); }, 1600);
      var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#C2F24A';
      var field = new BackgroundField(document.getElementById('bg'), { mode: 'plasma', accent: accent, intensity: 0.8, bg: '#08080A' });
      field.start();
      window.addEventListener('pointermove', function (e) { field.setMouse(e.clientX / innerWidth, e.clientY / innerHeight); });
      document.addEventListener('visibilitychange', function () { document.hidden ? field.stop() : field.start(); });

      document.querySelectorAll('a[data-nav]').forEach(function (a) {
        a.addEventListener('click', function (e) {
          var href = a.getAttribute('href');
          if (!href || href.charAt(0) === '#') return;
          e.preventDefault();
          var w = document.querySelector('.wipe');
          w.querySelector('.wipe-mark').textContent = '// ' + href.replace('.html', '');
          w.classList.add('in');
          setTimeout(function () { window.location.href = href; }, 540);
        });
      });
    })();
  </script>
</body>
</html>
